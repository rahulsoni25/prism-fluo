<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Four panels: detect GWI sheet, build insight slots, batch to Gemini, fallback chain." class="fig-svg" style="min-width:620px" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)"><defs><marker id="gp-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ink,#1c1a17)"/></marker><marker id="gp-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-muted,#6b665e)"/></marker><marker id="gp-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent,#3b4fd8)"/></marker><marker id="gp-arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-warn,#d03b3b)"/></marker><marker id="gp-arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ok,#0a7a3c)"/></marker><marker id="gp-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-line,#b8b1a5)"/></marker></defs><rect x="14" y="20" width="207" height="240" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1.25"/><rect x="14" y="20" width="207" height="240" rx="6" fill="var(--fig-accent,#3b4fd8)" stroke="none" stroke-width="1.25" fill-opacity="0.07"/><text x="28" y="42" font-size="13" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ink,#1c1a17)">Step 1 · Detect</text><line x1="28" y1="52" x2="207" y2="52" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1"/><text x="28" y="70" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">lib/gwi.ts — ALL must be true:</text><text x="28" y="84" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• headers contain Audience %</text><text x="28" y="98" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  (×2), Data point %, Universe,</text><text x="28" y="112" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  Index, Responses, Short</text><text x="28" y="126" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  Label, Attributes</text><text x="28" y="140" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• first 10 rows contain</text><text x="28" y="154" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  &quot;source: gwi&quot; OR &quot;time</text><text x="28" y="168" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  spent on social media&quot;</text><path d="M223,140 L236,140" fill="none" stroke="var(--fig-ink,#1c1a17)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#gp-arr-ink)"/><rect x="238" y="20" width="207" height="240" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1.25"/><rect x="238" y="20" width="207" height="240" rx="6" fill="var(--fig-accent,#3b4fd8)" stroke="none" stroke-width="1.25" fill-opacity="0.07"/><text x="252" y="42" font-size="13" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ink,#1c1a17)">Step 2 · Build slots</text><line x1="252" y1="52" x2="431" y2="52" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1"/><text x="252" y="70" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">buildInsightSlots</text><text x="252" y="84" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• group by question</text><text x="252" y="98" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• parse attr, audiencePct,</text><text x="252" y="112" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  dataPct, index, universe</text><text x="252" y="126" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• attr non-empty &amp; index &gt; 0</text><text x="252" y="140" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• sort by Index desc, top 10</text><text x="252" y="154" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• ≥ 2 slots per bucket, cap 20</text><text x="252" y="168" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• chart suggestion per slot</text><path d="M447,140 L460,140" fill="none" stroke="var(--fig-ink,#1c1a17)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#gp-arr-ink)"/><rect x="462" y="20" width="207" height="240" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1.25"/><rect x="462" y="20" width="207" height="240" rx="6" fill="var(--fig-accent,#3b4fd8)" stroke="none" stroke-width="1.25" fill-opacity="0.07"/><text x="476" y="42" font-size="13" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ink,#1c1a17)">Step 3 · Batch → Gemini</text><line x1="476" y1="52" x2="655" y2="52" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1"/><text x="476" y="70" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• max 18 slots</text><text x="476" y="84" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• batch size 6 → 3 parallel</text><text x="476" y="98" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  Gemini calls</text><text x="476" y="112" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• 30s hard timeout each</text><text x="476" y="126" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  via withTimeout()</text><text x="476" y="140" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">• Promise.allSettled — failed</text><text x="476" y="154" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  batches log a warning,</text><text x="476" y="168" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  don't crash</text><path d="M671,140 L684,140" fill="none" stroke="var(--fig-ink,#1c1a17)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#gp-arr-ink)"/><rect x="686" y="20" width="207" height="240" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-muted,#6b665e)" stroke-width="1.25"/><rect x="686" y="20" width="207" height="240" rx="6" fill="var(--fig-muted,#6b665e)" stroke="none" stroke-width="1.25" fill-opacity="0.07"/><text x="700" y="42" font-size="13" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ink,#1c1a17)">Step 4 · Fallback chain</text><line x1="700" y1="52" x2="879" y2="52" stroke="var(--fig-muted,#6b665e)" stroke-width="1"/><text x="700" y="70" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">insights.length === 0</text><text x="700" y="84" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  (all Gemini batches failed)</text><text x="700" y="98" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">→ OpenRouter with ALL slots</text><text x="700" y="112" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">→ generateFallbackCards(slots)</text><text x="700" y="126" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">→ 422 error if no slots</text><text x="700" y="140" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">  (no index scores)</text><text x="14" y="286" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">lib/gwi.ts → buildInsightSlots → app/api/ai/analyze-data/route.ts</text></svg>
