<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" role="img" aria-label="Two bars representing a dataset: the first shaded only at the head, the second with evenly spaced tick marks from head to tail." class="fig-svg" style="min-width:620px" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)"><defs><marker id="st-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ink,#1c1a17)"/></marker><marker id="st-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-muted,#6b665e)"/></marker><marker id="st-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent,#3b4fd8)"/></marker><marker id="st-arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-warn,#d03b3b)"/></marker><marker id="st-arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ok,#0a7a3c)"/></marker><marker id="st-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-line,#b8b1a5)"/></marker></defs><text x="14" y="52" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-muted,#6b665e)" letter-spacing="0.08em">FIRST 120 ROWS</text><text x="14" y="70" font-size="10.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-muted,#6b665e)" font-style="italic">not what PRISM does</text><rect x="200" y="40" width="660" height="30" rx="4" fill="var(--fig-fill,#f2efe8)" stroke="var(--fig-line,#b8b1a5)" stroke-width="1.25"/><rect x="200" y="40" width="92.4" height="30" rx="4" fill="var(--fig-warn,#d03b3b)" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.25" fill-opacity="0.18"/><text x="302.4" y="59" font-size="10.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-warn,#d03b3b)" font-style="italic">the tail is never seen — e.g. sorted-by-date exports</text><text x="14" y="132" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-muted,#6b665e)" letter-spacing="0.08em">STRATIFIED SAMPLE</text><text x="14" y="150" font-size="10.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-muted,#6b665e)" font-style="italic">what Gemini sees · n = 120</text><rect x="200" y="120" width="660" height="30" rx="4" fill="var(--fig-fill,#f2efe8)" stroke="var(--fig-line,#b8b1a5)" stroke-width="1.25"/><line x1="200" y1="124" x2="200" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="222.75862068965517" y1="124" x2="222.75862068965517" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="245.51724137931035" y1="124" x2="245.51724137931035" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="268.2758620689655" y1="124" x2="268.2758620689655" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="291.0344827586207" y1="124" x2="291.0344827586207" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="313.7931034482759" y1="124" x2="313.7931034482759" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="336.55172413793105" y1="124" x2="336.55172413793105" y2="146" stroke="var(--fig-accent,#3b4fd8)" stroke-width="2"/><line x1="359.3103448275862" y1="124" x2="359.3103448275862" y2="146"