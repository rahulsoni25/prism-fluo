<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Three batches, one failed, feeding Promise.all which rejects with zero cards, versus Promise.allSettled which returns cards from the two successful batches." class="fig-svg" style="min-width:620px" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)"><defs><marker id="as-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ink,#1c1a17)"/></marker><marker id="as-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-muted,#6b665e)"/></marker><marker id="as-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent,#3b4fd8)"/></marker><marker id="as-arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-warn,#d03b3b)"/></marker><marker id="as-arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ok,#0a7a3c)"/></marker><marker id="as-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-line,#b8b1a5)"/></marker></defs><rect x="14" y="14" width="426" height="230" rx="8" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-line,#b8b1a5)" stroke-width="1.25"/><text x="30" y="40" font-size="13" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="700" fill="var(--fig-ink,#1c1a17)">Promise.all</text><rect x="30" y="62" width="120" height="34" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.25"/><rect x="30" y="62" width="120" height="34" rx="6" fill="var(--fig-ok,#0a7a3c)" stroke="none" stroke-width="1.25" fill-opacity="0.12"/><text x="90" y="83" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ok,#0a7a3c)">Batch 1 · ok</text><path d="M150,79 L214,79 L214,128 L244,128" fill="none" stroke="var(--fig-muted,#6b665e)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="30" y="110" width="120" height="34" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.25"/><rect x="30" y="110" width="120" height="34" rx="6" fill="var(--fig-warn,#d03b3b)" stroke="none" stroke-width="1.25" fill-opacity="0.12"/><text x="90" y="131" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-warn,#d03b3b)">Batch 2 · fails</text><path d="M150,127 L214,127 L214,128 L244,128" fill="none" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#as-arr-warn)"/><rect x="30" y="158" width="120" height="34" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.25"/><rect x="30" y="158" width="120" height="34" rx="6" fill="var(--fig-ok,#0a7a3c)" stroke="none" stroke-width="1.25" fill-opacity="0.12"/><text x="90" y="179" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ok,#0a7a3c)">Batch 3 · ok</text><path d="M150,175 L214,175 L214,128 L244,128" fill="none" stroke="var(--fig-muted,#6b665e)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="244" y="100" width="180" height="56" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.25"/><rect x="244" y="100" width="180" height="56" rx="6" fill="var(--fig-warn,#d03b3b)" stroke="none" stroke-width="1.25" fill-opacity="0.1"/><text x="334" y="125.4625" font-size="13" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ink,#1c1a17)">rejects on first failure</text><text x="334" y="143.0375" font-size="10.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-muted,#6b665e)">one bad batch kills all results</text><rect x="460" y="14" width="426" height="230" rx="8" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-line,#b8b1a5)" stroke-width="1.25"/><text x="476" y="40" font-size="13" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="700" fill="var(--fig-ink,#1c1a17)">Promise.allSettled</text><rect x="476" y="62" width="120" height="34" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.25"/><rect x="476" y="62" width="120" height="34" rx="6" fill="var(--fig-ok,#0a7a3c)" stroke="none" stroke-width="1.25" fill-opacity="0.12"/><text x="536" y="83" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ok,#0a7a3c)">Batch 1 · ok</text><path d="M596,79 L660,79 L660,128 L690,128" fill="none" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.4" stroke-linejoin="round"/><rect x="476" y="110" width="120" height="34" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.25"/><rect x="476" y="110" width="120" height="34" rx="6" fill="var(--fig-warn,#d03b3b)" stroke="none" stroke-width="1.25" fill-opacity="0.12"/><text x="536" y="131" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-warn,#d03b3b)">Batch 2 · fails</text><path d="M596,127 L660,127 L660,128 L690,128" fill="none" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#as-arr-warn)"/><rect x="476" y="158" width="120" height="34" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.25"/><rect x="476" y="158" width="120" height="34" rx="6" fill="var(--fig-ok,#0a7a3c)" stroke="none" stroke-width="1.25" fill-opacity="0.12"/><text x="536" y="179" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ok,#0a7a3c)">Batch 3 · ok</text><path d="M596,175 L660,175 L660,128 L690,128" fill="none" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.4" stroke-linejoin="round"/><rect x="690" y="100" width="180" height="56" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-ok,#0a7a3c)" stroke-width="1.25"/><rect x="690" y="100" width="180" height="56" rx="6" fill="var(--fig-ok,#0a7a3c)" stroke="none" stroke-width="1.25" fill-opacity="0.1"/><text x="780" y="125.4625" font-size="13" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-ink,#1c1a17)">collects every result</text><text x="780" y="143.0375" font-size="10.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-muted,#6b665e)">cards from the other two batches</text><text x="24" y="232" font-size="10" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">dashed = result discarded</text></svg>
