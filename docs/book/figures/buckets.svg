<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" role="img" aria-label="Four tiles: Content, Commerce, Communication and Culture, each with what it covers." class="fig-svg" style="min-width:620px" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)"><defs><marker id="buckets-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ink,#1c1a17)"/></marker><marker id="buckets-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-muted,#6b665e)"/></marker><marker id="buckets-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent,#3b4fd8)"/></marker><marker id="buckets-arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-warn,#d03b3b)"/></marker><marker id="buckets-arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ok,#0a7a3c)"/></marker><marker id="buckets-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-line,#b8b1a5)"/></marker></defs><text x="14" y="22" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-muted,#6b665e)" letter-spacing="0.08em">EVERY INSIGHT CARD → ONE OF FOUR BUCKETS · SHOWN AS TABS ON THE INSIGHTS PAGE</text><rect x="14" y="40" width="207" height="156" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-content,#2a78d6)" stroke-width="1.25"/><rect x="14" y="40" width="207" height="7" rx="3" fill="var(--fig-content,#2a78d6)"/><text x="30" y="82" font-size="20" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink,#1c1a17)">📝</text><text x="60" y="81" font-size="16" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="700" fill="var(--fig-content,#2a78d6)">Content</text><text x="30" y="110" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">What people watch/read/play,</text><text x="30" y="127" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">formats, devices, screen</text><text x="30" y="144" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">behaviour, OTT, streaming</text><rect x="238" y="40" width="207" height="156" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-commerce,#eb6834)" stroke-width="1.25"/><rect x="238" y="40" width="207" height="7" rx="3" fill="var(--fig-commerce,#eb6834)"/><text x="254" y="82" font-size="20" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink,#1c1a17)">🛒</text><text x="284" y="81" font-size="16" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="700" fill="var(--fig-commerce,#eb6834)">Commerce</text><text x="254" y="110" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">Purchase behaviour, shopping,</text><text x="254" y="127" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">pricing, brand preference,</text><text x="254" y="144" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">retailers, e-commerce, BSR</text><rect x="462" y="40" width="207" height="156" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-communication,#1baf7a)" stroke-width="1.25"/><rect x="462" y="40" width="207" height="7" rx="3" fill="var(--fig-communication,#1baf7a)"/><text x="478" y="82" font-size="20" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink,#1c1a17)">📢</text><text x="508" y="81" font-size="16" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="700" fill="var(--fig-communication,#1baf7a)">Communication</text><text x="478" y="110" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">How brands show up: ads,</text><text x="478" y="127" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">campaigns, discovery, social</text><text x="478" y="144" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">media, brand voice, earned</text><text x="478" y="161" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">media</text><rect x="686" y="40" width="207" height="156" rx="6" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-culture,#4a3aa7)" stroke-width="1.25"/><rect x="686" y="40" width="207" height="7" rx="3" fill="var(--fig-culture,#4a3aa7)"/><text x="702" y="82" font-size="20" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink,#1c1a17)">🌍</text><text x="732" y="81" font-size="16" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="700" fill="var(--fig-culture,#4a3aa7)">Culture</text><text x="702" y="110" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">Who the audience is:</text><text x="702" y="127" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">demographics, lifestyle,</text><text x="702" y="144" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">values, identity, family,</text><text x="702" y="161" font-size="11.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">employment</text><text x="14" y="220" font-size="11" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">8 insight cards per analysis · 2 per bucket</text></svg>
