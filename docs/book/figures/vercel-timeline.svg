<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Two timelines from 0 to 60 seconds comparing a hanging Gemini call without a timeout against three 30-second batches followed by an OpenRouter window." class="fig-svg" style="min-width:620px" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)"><defs><marker id="vt-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ink,#1c1a17)"/></marker><marker id="vt-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-muted,#6b665e)"/></marker><marker id="vt-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent,#3b4fd8)"/></marker><marker id="vt-arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-warn,#d03b3b)"/></marker><marker id="vt-arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-ok,#0a7a3c)"/></marker><marker id="vt-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-line,#b8b1a5)"/></marker></defs><line x1="190" y1="40" x2="190" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="190" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">0s</text><line x1="300" y1="40" x2="300" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="300" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">10s</text><line x1="410" y1="40" x2="410" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="410" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">20s</text><line x1="520" y1="40" x2="520" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="520" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">30s</text><line x1="630" y1="40" x2="630" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="630" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">40s</text><line x1="740" y1="40" x2="740" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="740" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">50s</text><line x1="850" y1="40" x2="850" y2="300" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="850" y="318" font-size="10.5" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">60s</text><line x1="850" y1="36" x2="850" y2="304" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="844" y="32" font-size="10.5" text-anchor="end" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-warn,#d03b3b)">maxDuration = 60s · function killed</text><text x="14" y="70" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-muted,#6b665e)" letter-spacing="0.08em">WITHOUT WITHTIMEOUT()</text><text x="14" y="90" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">one Gemini batch hangs</text><rect x="190" y="100" width="660" height="28" rx="4" fill="var(--fig-warn,#d03b3b)" stroke="var(--fig-warn,#d03b3b)" stroke-width="1.25" fill-opacity="0.15"/><text x="520" y="119" font-size="11.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-warn,#d03b3b)">Gemini batch … still waiting …</text><text x="858" y="119" font-size="14" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="700" fill="var(--fig-warn,#d03b3b)">✕</text><text x="190" y="148" font-size="10.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-muted,#6b665e)" font-style="italic">fallback code never runs — the request ends as a 504</text><line x1="14" y1="172" x2="886" y2="172" stroke="var(--fig-line,#b8b1a5)" stroke-width="1"/><text x="14" y="196" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-muted,#6b665e)" letter-spacing="0.08em">WITH WITHTIMEOUT(30S)</text><text x="14" y="216" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)">3 parallel batches, 30s each</text><rect x="190" y="186" width="330" height="18" rx="3" fill="var(--fig-tier1,#1c5cab)" stroke="var(--fig-tier1,#1c5cab)" stroke-width="1.25" fill-opacity="0.16"/><text x="355" y="199" font-size="10.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-tier1,#1c5cab)">Gemini batch 1 · 30s hard timeout</text><rect x="190" y="210" width="330" height="18" rx="3" fill="var(--fig-tier1,#1c5cab)" stroke="var(--fig-tier1,#1c5cab)" stroke-width="1.25" fill-opacity="0.16"/><text x="355" y="223" font-size="10.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-tier1,#1c5cab)">Gemini batch 2 · 30s hard timeout</text><rect x="190" y="234" width="330" height="18" rx="3" fill="var(--fig-tier1,#1c5cab)" stroke="var(--fig-tier1,#1c5cab)" stroke-width="1.25" fill-opacity="0.16"/><text x="355" y="247" font-size="10.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-tier1,#1c5cab)">Gemini batch 3 · 30s hard timeout</text><line x1="520" y1="182" x2="520" y2="280" stroke="var(--fig-ink,#1c1a17)" stroke-width="1.2"/><text x="526" y="276" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink2,#4a463f)">Promise.allSettled resolves by t=30</text><rect x="520" y="234" width="275" height="18" rx="3" fill="var(--fig-tier2,#3987e5)" stroke="var(--fig-tier2,#3987e5)" stroke-width="1.25" fill-opacity="0.16"/><text x="657.5" y="247" font-size="10.5" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="600" fill="var(--fig-tier2,#3987e5)">OpenRouter · ~25s if needed</text></svg>
