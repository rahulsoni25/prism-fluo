-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink,#1c1a17)">    that is 1.41× the national average...</text><text x="28" y="300" font-size="10.5" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-muted,#6b665e)" font-style="italic">one slot → one card · Card 1 → SLOT 1 only</text><path d="M390,176 L510,176" fill="none" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ca-arr-accent)"/><text x="450" y="150.8" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="500" fill="var(--fig-accent,#3b4fd8)" paint-order="stroke" stroke="var(--fig-surface,#ffffff)" stroke-width="4" stroke-linejoin="round">Gemini translates</text><text x="450" y="165.8" font-size="11" text-anchor="middle" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="500" fill="var(--fig-accent,#3b4fd8)" paint-order="stroke" stroke="var(--fig-surface,#ffffff)" stroke-width="4" stroke-linejoin="round">numbers → words</text><rect x="514" y="26" width="372" height="300" rx="8" fill="var(--fig-surface,#ffffff)" stroke="var(--fig-line,#b8b1a5)" stroke-width="1.25"/><rect x="528" y="38" width="59.4" height="20" rx="10" fill="var(--fig-culture,#4a3aa7)" stroke="var(--fig-culture,#4a3aa7)" stroke-width="1.25" fill-opacity="0.12"/><rect x="528" y="38" width="59.4" height="20" rx="10" fill="none" stroke="var(--fig-culture,#4a3aa7)" stroke-width="1.25"/><text x="557.7" y="51.6" font-size="10" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="500" fill="var(--fig-culture,#4a3aa7)">CULTURE</text><rect x="606" y="38" width="84.2" height="20" rx="10" fill="var(--fig-muted,#6b665e)" stroke="var(--fig-muted,#6b665e)" stroke-width="1.25" fill-opacity="0.12"/><rect x="606" y="38" width="84.2" height="20" rx="10" fill="none" stroke="var(--fig-muted,#6b665e)" stroke-width="1.25"/><text x="648.1" y="51.6" font-size="10" text-anchor="middle" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="500" fill="var(--fig-muted,#6b665e)">chart: hbar</text><text x="872" y="53" font-size="10" text-anchor="end" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">conviction 90 · GWI</text><text x="528" y="84" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-accent,#3b4fd8)" letter-spacing="0.08em">TITLE</text><text x="528" y="100" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">magazine cover line — lead with the surprising</text><text x="528" y="115" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">finding, include one plain-English number</text><text x="528" y="136" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-accent,#3b4fd8)" letter-spacing="0.08em">OBSERVATION</text><text x="528" y="152" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">S1 · punchy surprising fact from the highest-index item</text><text x="528" y="167" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">S2 · the exact numbers in plain English</text><text x="528" y="182" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">S3 · the strategic so-what, one direct sentence</text><text x="528" y="204" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-accent,#3b4fd8)" letter-spacing="0.08em">STAT</text><text x="528" y="220" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">one crisp number that would make a room go quiet</text><text x="528" y="242" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-accent,#3b4fd8)" letter-spacing="0.08em">RECOMMENDATION</text><text x="528" y="258" font-size="11" text-anchor="start" font-family="var(--fig-font,'IBM Plex Sans',system-ui,sans-serif)" font-weight="400" fill="var(--fig-ink2,#4a463f)" font-style="italic">a direct brief: platform · format · creative angle</text><line x1="528" y1="288" x2="872" y2="288" stroke="var(--fig-soft,#e8e3d9)" stroke-width="1"/><text x="528" y="308" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-muted,#6b665e)">chart from the same slot · never raw Index numbers</text><rect x="14" y="342" width="872" height="78" rx="6" fill="var(--fig-accent,#3b4fd8)" stroke="var(--fig-accent,#3b4fd8)" stroke-width="1.25" fill-opacity="0.06"/><text x="28" y="362" font-size="10.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="600" fill="var(--fig-muted,#6b665e)" letter-spacing="0.08em">ALLOWED TRANSLATIONS (FROM THE ANTI-HALLUCINATION RULE)</text><text x="28" y="384" font-size="11.5" text-anchor="start" font-family="var(--fig-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace)" font-weight="400" fill="var(--fig-ink,#